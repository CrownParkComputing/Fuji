name: iOS

# Builds, signs and uploads STDesk -- the Atari ST emulator, on the Hatari
# core. Modelled on the DOSDeck workflow in CrownParkComputing/Retro-Dosbox,
# which is proven end to end; the comments that look like scar tissue are.
#
# THIS APP HAS NEVER BEEN COMPILED. It was written on a Linux machine with no
# Xcode, so the CMake wiring, the Swift sources and the plists are verified by
# inspection only. Expect the first runs to surface ordinary compile errors;
# that is the point of running it, not a sign the approach is wrong.
#
# SECRETS
#   STDESK_PROFILE_BASE64  "STDesk AppStore" profile (DJ9QSQL75F)
#   APPSTORE_CERT_BASE64    distribution .p12, exported with -legacy
#   APPSTORE_CERT_PASSWORD  its password
#   ASC_KEY_P8_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID   App Store Connect API key
#
# Gated on those being set, so a fork still compiles the app unsigned -- and a
# broken tree therefore still fails loudly rather than waiting to be noticed.

on:
  push:
    # `stdesk` is here because the SwiftUI tree lives on it and GitHub only
    # offers workflow_dispatch for workflows already on the DEFAULT branch --
    # so until this becomes main there is no other way to run the job. The
    # repository's main is an earlier, abandoned C/GEM implementation; which
    # of the two becomes main is not this file's decision to make.
    branches: [main, stdesk]
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      only:
        description: "Which half to run"
        type: choice
        default: all
        options: [all, app, screenshots]

env:
  # One place that decides the identity. Spelling these out per-step is how
  # the sibling app ended up building a target and a bundle id that had both
  # been renamed months earlier.
  APP: STDesk
  BUNDLE_ID: com.crownparkcomputing.stdesk
  TEAM_ID: 88A3T9K9C5
  PROFILE_NAME: ST Desk AppStore
  # `cmake -S core` means the generated project carries HATARI's name, not the
  # app's; the app is a target and a scheme inside it.
  XCPROJ: Hatari.xcodeproj

jobs:
  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'screenshots'
    runs-on: macos-26
    env:
      HAS_IOS_SIGNING: ${{ secrets.STDESK_PROFILE_BASE64 != '' && secrets.APPSTORE_CERT_BASE64 != '' }}

    steps:
      # The Hatari core is a submodule and nothing builds without it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Choose a build number
        id: buildno
        # App Store Connect refuses a CFBundleVersion it has already seen, and
        # says so only AFTER the whole upload has transferred. A UTC timestamp
        # is monotonic without having to ask the server what it already holds.
        run: echo "n=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Decrypt the signing material
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          CERT_B64: ${{ secrets.APPSTORE_CERT_BASE64 }}
          PROFILE_B64: ${{ secrets.STDESK_PROFILE_BASE64 }}
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/signing"; mkdir -p "$D"; chmod 700 "$D"
          printf '%s' "$CERT_B64"    | base64 --decode > "$D/dist.p12"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$D/profile.mobileprovision"
          printf '%s' "$KEY_B64"     | base64 --decode > "$D/asc_key.p8"
          echo "D=$D" >> "$GITHUB_ENV"

      # The profile must be for THIS bundle id. Getting it wrong produces a
      # signed archive that fails at -exportArchive with a message about
      # entitlements that never names the mismatch.
      - name: Check the profile matches the app
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          plist=$(security cms -D -i "$D/profile.mobileprovision")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<<"$plist")
          appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<<"$plist")
          echo "profile: $name"
          echo "app id : $appid"
          [ "$name"  = "$PROFILE_NAME" ]       || { echo "::error::profile is '$name', expected '$PROFILE_NAME'"; exit 1; }
          [ "$appid" = "$TEAM_ID.$BUNDLE_ID" ] || { echo "::error::profile is for $appid, expected $TEAM_ID.$BUNDLE_ID"; exit 1; }

      - name: Import signing certificate
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"      # no auto-lock mid-build
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$D/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # codesign: in the partition list is the whole point. Without it the
          # key imports, `security find-identity` reports it valid, and every
          # signing attempt fails with errSecInternalComponent -- which reads
          # like a broken certificate and is nothing of the kind.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$D/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configure
        env:
          BUILD_NUMBER: ${{ steps.buildno.outputs.n }}
        run: |
          set -euo pipefail
          if [ "$HAS_IOS_SIGNING" = "true" ]; then
            SIGN_ARGS=(-DSTDESK_CODE_SIGN_STYLE=Manual
                       -DSTDESK_PROVISIONING_PROFILE="$PROFILE_NAME"
                       -DSTDESK_CODE_SIGN_IDENTITY="Apple Distribution")
          else
            SIGN_ARGS=()
          fi
          STDESK_CONFIGURE_ONLY=1 ./build.sh iphoneos \
            -DDEVELOPMENT_TEAM="$TEAM_ID" \
            -DSTDESK_BUILD_NUMBER="$BUILD_NUMBER" \
            "${SIGN_ARGS[@]+"${SIGN_ARGS[@]}"}"

      # Signing lives on the target (set in cmake/stdesk-app.cmake), never on
      # this command line: a command-line PROVISIONING_PROFILE_SPECIFIER
      # applies to EVERY target, including the static libraries, which then
      # fail with "does not support provisioning profiles".
      - name: Archive
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "build/iphoneos/$XCPROJ" -scheme "$APP" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "build/$APP.xcarchive"

      - name: Build (unsigned, no secrets configured)
        if: env.HAS_IOS_SIGNING != 'true'
        run: |
          xcodebuild -project "build/iphoneos/$XCPROJ" -scheme "$APP" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      # The review notes will claim this app has no network features. A
      # configure flag is a claim; a symbol table is the fact. Retro-Amiga
      # was rejected under guideline 5.6 -- "features that appear to have
      # been intentionally hidden during review" -- for notes that said no
      # networking over a binary that imported sockets, which nobody had put
      # there on purpose. So the claim is checked against the BINARY, on
      # every run, signed or not.
      #
      # Whole symbols, via -x on the extracted name: the sibling app matched
      # substrings and every PC-98 *_bind symbol read as the socket call
      # bind(), which failed its build for eight days over nothing.
      - name: Check the binary cannot reach a network
        run: |
          set -euo pipefail
          app=$(find build -name "$APP.app" -type d | head -1)
          [ -n "$app" ] || { echo "::error::no $APP.app was built"; exit 1; }
          BAD=$(nm -u "$app/$APP" 2>/dev/null | awk '{print $NF}' \
                | grep -xE '_(socket|connect|bind|listen|accept|getaddrinfo|gethostbyname|sendto|recvfrom)' \
                | sort -u || true)
          if [ -n "$BAD" ]; then
            echo "::error::this build can reach the network, and the review notes say it cannot:"
            echo "$BAD" | sed 's/^/    /'
            exit 1
          fi
          echo "clean: no socket imports in $APP"

      # An upload can report "UPLOAD SUCCEEDED", be given a delivery UUID, and
      # then be discarded in processing -- by email, with CI green and no
      # build ever appearing. A missing icon key and a missing purpose string
      # both do exactly that, so they are checked in the BUILT bundle.
      - name: Verify the bundle cannot be discarded in processing
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          app="build/$APP.xcarchive/Products/Applications/$APP.app"
          plist="$app/Info.plist"
          need() {
            /usr/bin/plutil -extract "$1" raw -o - "$plist" >/dev/null 2>&1 \
              || { echo "::error::$1 is missing from the built bundle"; exit 1; }
          }
          need CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName
          need ITSAppUsesNonExemptEncryption

          # The shipped app must not call itself Fuji or Retro-AtariST
          # anywhere a reviewer can see. That leftover is exactly what
          # guideline 4.3 reads as one app submitted twice, and the sibling
          # app shipped a demo that did it.
          for key in CFBundleDisplayName CFBundleName; do
            v=$(/usr/bin/plutil -extract "$key" raw -o - "$plist")
            echo "  $key = $v"
            case "$v" in *Fuji*|*Retro*) echo "::error::$key is '$v'"; exit 1 ;; esac
          done

          # Purpose strings, derived from what the BINARY links rather than
          # from a list somebody remembered to update. Apple reports the lack
          # only after a delivery that reported success -- ITMS-90683, by
          # email, hours later, with the job green.
          bin="$app/$APP"
          check_api() {   # <objc class> <Info.plist key>
            if nm -u "$bin" 2>/dev/null | grep -q "$1"; then
              need "$2"
              echo "  $1 is linked -> $2 present"
            fi
          }
          check_api CBCentralManager  NSBluetoothAlwaysUsageDescription
          check_api AVCaptureDevice   NSCameraUsageDescription
          check_api AVAudioSession    NSMicrophoneUsageDescription
          check_api CLLocationManager NSLocationWhenInUseUsageDescription
          check_api PHPhotoLibrary    NSPhotoLibraryUsageDescription
          echo "bundle looks deliverable"

      - name: Export the IPA
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "build/$APP.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      # Before the upload, not after: a signed IPA that exists is worth having
      # even when the upload is refused, and the first thing that refuses it
      # is an App Store record that does not exist yet.
      - name: Keep the IPA
        if: env.HAS_IOS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$D/asc_key.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          if ! xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
                 --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/altool.log; then
            if grep -qi "no suitable application record" /tmp/altool.log; then
              echo "::error::No App Store record for $BUNDLE_ID. It cannot be created from an API key -- app creation is a web-session operation. Make it once by hand, then re-run."
            fi
            exit 1
          fi
